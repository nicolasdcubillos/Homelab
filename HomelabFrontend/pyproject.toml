[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homelab-dashboard"
version = "0.1.0"
description = "Panel de control web para administrar servicios en la homelab VM (PortfolioWatcher, StockWatcher, etc.)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
homelab-dashboard = "homelab_dashboard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_dashboard"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
