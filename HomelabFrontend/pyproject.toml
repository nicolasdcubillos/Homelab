[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homelab-dashboard"
version = "0.1.0"
description = "Panel de control web para administrar servicios en la homelab VM (PortfolioWatcher, StockWatcher, etc.)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "apscheduler>=3.10,<4",
    "pydantic[email]>=2.6",
    "tzdata>=2024.1",
    # El dashboard habla con la API REST de Freqtrade (ver `trading.py`), así
    # que httpx dejó de ser solo una dependencia de test.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
regime-notifications = [
    "azure-communication-messages>=1.1.0,<2",
    "azure-communication-email>=1.0.0,<2",
]

[project.scripts]
homelab-dashboard = "homelab_dashboard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_dashboard"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
