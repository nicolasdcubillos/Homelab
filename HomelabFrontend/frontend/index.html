<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f4f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141419" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Homelab" />
    <meta name="description" content="Panel de control de tus vigilantes de precios y portafolio." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Homelab</title>
    <script>
      // El tema se aplica antes del primer pintado para que no haya un
      // destello blanco al abrir la app de noche.
      (function () {
        try {
          var guardado = localStorage.getItem("hld:tema");
          var oscuro =
            guardado === "oscuro" ||
            ((!guardado || guardado === "sistema") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = oscuro ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
