# Configuración de Alembic para HomelabDashboard.
#
# La URL de la base NO se escribe aquí: `env.py` la deriva de
# `homelab_dashboard.settings.load_settings()`, para que las migraciones usen
# exactamente la misma ruta que la aplicación (y respeten DASHBOARD_DATA_DIR /
# DASHBOARD_DB_FILE en la VM) sin duplicar configuración.
#
# En producción no hace falta invocar `alembic` a mano: usa
# `homelab-dashboard migrate`, que ejecuta esto mismo de forma programática.

[alembic]
script_location = src/homelab_dashboard/migrations
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
