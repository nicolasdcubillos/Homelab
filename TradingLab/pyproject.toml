[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradinglab"
version = "0.1.0"
description = "Motor de trading simulado de acciones y ETFs para el dashboard del homelab."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# El núcleo no depende de nada fuera de la biblioteca estándar, y es a
# propósito: el bucle de supervisión, el contrato con el dashboard y la
# contabilidad tienen que poder correr —y probarse— sin instalar Lumibot, que
# arrastra decenas de paquetes pesados.
dependencies = []

[project.optional-dependencies]
# Lumibot trae más de cincuenta dependencias directas (pyarrow, polars, scipy,
# boto3, ccxt, duckdb, matplotlib…) y ocupa varios cientos de megabytes. Por eso
# es un extra y no una dependencia normal: en un portátil o en CI se instala el
# paquete pelado y todo funciona salvo el motor real.
alpaca = ["lumibot>=4.5.88,<5"]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
tradinglab = "tradinglab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tradinglab"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# B008: los `field(default_factory=...)` de los dataclasses.
# RUF001/2/3: el código y los comentarios están en español, con tildes y signos
#             de apertura que estas reglas confunden con caracteres ambiguos.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
