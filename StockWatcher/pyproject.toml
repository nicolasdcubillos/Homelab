[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stockwatcher"
version = "0.1.0"
description = "Generic product availability watcher with WhatsApp alerts, running on Azure."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
azure = [
    "azure-communication-messages>=1.1.0",
    "azure-data-tables>=12.5.0",
    "azure-identity>=1.17.0",
]
browser = [
    "playwright>=1.44",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
stockwatcher = "stockwatcher.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stockwatcher"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# B027: intentional no-op hooks on our ABCs (providers/notifiers may own
#       resources, most do not, so overriding must stay optional).
# UP042: StrEnum would break `Gender("mens")` round-tripping in YAML config.
ignore = ["B008", "B027", "RUF001", "RUF002", "RUF003", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
