[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portfoliowatcher"
version = "0.1.0"
description = "Long-term stock portfolio watcher with AI-assisted risk/opportunity signals. Informational only, never trades."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "yfinance>=0.2.40",
    "feedparser>=6.0",
]

[project.optional-dependencies]
azure = [
    "openai>=1.35",
    "azure-communication-messages>=1.1.0",
    "azure-identity>=1.17.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
portfoliowatcher = "portfoliowatcher.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/portfoliowatcher"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# B027: intentional no-op hooks on our ABCs (Notifier implementations may own
#       resources; most do not, so overriding must stay optional).
ignore = ["B008", "B027", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
