name: One-off VM setup (debug dashboard)
on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: [self-hosted, homelab-vm]
    steps:
      - name: Dashboard status + logs
        run: |
          systemctl status homelab-dashboard.service --no-pager -l || true
          echo "---journal---"
          journalctl -u homelab-dashboard.service -n 60 --no-pager || true
          echo "---unit file---"
          cat /etc/systemd/system/homelab-dashboard.service
