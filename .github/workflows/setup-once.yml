name: One-off VM setup (kill port 8000 holder)
on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: [self-hosted, homelab-vm]
    steps:
      - name: Find and kill whatever holds port 8000
        run: |
          echo "---lsof---"
          sudo lsof -i :8000 || true
          echo "---ss---"
          sudo ss -ltnp | grep 8000 || true
          echo "---ps grep dashboard---"
          ps aux | grep -i dashboard | grep -v grep || true

      - name: Stop service, kill any stray process on 8000, restart
        run: |
          sudo systemctl stop homelab-dashboard.service
          sleep 2
          PID=$(sudo lsof -t -i :8000 || true)
          if [ -n "$PID" ]; then
            echo "Killing stray PID(s): $PID"
            sudo kill -9 $PID || true
          fi
          sleep 2
          sudo systemctl start homelab-dashboard.service
          sleep 3
          systemctl is-active homelab-dashboard.service
          curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8000/
