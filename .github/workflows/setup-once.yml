name: One-off VM setup (verify)
on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: [self-hosted, homelab-vm]
    steps:
      - name: Status of all services
        run: |
          systemctl is-active stockwatcher-run.timer portfoliowatcher-daily.timer portfoliowatcher-weekly.timer homelab-dashboard.service
          echo "---dashboard curl---"
          curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8000/ || echo "curl failed"
          echo "---manual stockwatcher run from new path---"
          sudo -u azureuser bash -c 'export PLAYWRIGHT_BROWSERS_PATH=/home/azureuser/.cache/ms-playwright; cd /opt/services/homelab/StockWatcher && .venv/bin/stockwatcher run --dry-run --no-discovery 2>&1 | tail -20'
