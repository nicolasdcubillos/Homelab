name: Deploy HomelabFrontend

on:
  push:
    branches: [main]
    paths:
      - "HomelabFrontend/**"
      - ".github/workflows/deploy-homelabfrontend.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-homelabfrontend
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, homelab-vm]
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Deploy isolated dashboard with database backup
        run: sudo bash HomelabFrontend/scripts/deploy-market-regime.sh "$GITHUB_SHA"
