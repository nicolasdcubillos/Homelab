name: Deploy HomelabFrontend

on:
  push:
    branches: [main]
    paths:
      - "HomelabFrontend/**"
      - ".github/workflows/deploy-homelabfrontend.yml"
  workflow_dispatch:
    inputs:
      recover:
        description: Recuperar un despliegue fallido con el servicio detenido
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-homelabfrontend
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, homelab-vm]
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Deploy isolated dashboard with database backup
        env:
          RECOVER_DEPLOYMENT: ${{ inputs.recover && 'true' || 'false' }}
        run: |
          args=("$GITHUB_SHA")
          if [ "$RECOVER_DEPLOYMENT" = true ]; then args+=(--recover); fi
          sudo bash HomelabFrontend/scripts/deploy-market-regime.sh "${args[@]}"
