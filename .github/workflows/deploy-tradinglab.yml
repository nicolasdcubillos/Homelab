name: Deploy TradingLab

on:
  push:
    branches: [main]
    paths:
      - "TradingLab/**"
      - ".github/workflows/deploy-tradinglab.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-tradinglab
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, homelab-vm]
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Deploy isolated release
        run: sudo bash TradingLab/scripts/deploy.sh "$GITHUB_SHA"
